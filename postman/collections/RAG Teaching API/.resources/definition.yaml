  sampleText: Libra Bank issues debit and credit cards to retail customers. A card can be blocked automatically after three failed PIN attempts, after a suspicious transaction is detected by the fraud engine, or at the customer's own request through the mobile application. A blocked card can be unblocked in the branch after identity verification, or through the call center using the phone banking password.\n\nFor lost or stolen cards, the customer must call the 24/7 support line immediately. The card is cancelled and a replacement is issued within five working days. Replacement fees are waived for premium accounts. Transactions made after the loss was reported are fully covered by the bank.\n\nMortgage loans at Libra Bank require a down payment of at least fifteen percent for a first home. The interest rate can be fixed for the first five years, then variable, indexed to IRCC plus a fixed margin. Early repayment is possible at any time; for the fixed-rate period an early repayment fee of one percent applies, while in the variable period early repayment is free of charge.\n\nTerm deposits can be opened in RON, EUR or USD, with maturities from one month to two years. Interest is paid at maturity. Breaking a deposit before maturity forfeits the accrued interest, and the principal is returned in full to the current account.
